version: '3.8'

services:
  db:
    image: mariadb:10.11 # MariaDB is highly recommended for Raspberry Pi
    container_name: mysql-db
    restart: always
    env_file:
      - .env
    environment:
      MYSQL_DATABASE: ${DATABASE_NAME}
      MYSQL_ROOT_PASSWORD: ${DATABASE_ROOT_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - cloudflare_net

networks:
  cloudflare_net:
    external: true

volumes:
  mysql_data: