version: '3.8'

services:
  db:
    image: mariadb:10.11
    container_name: ebbinghaus-db
    restart: always
    env_file: .env
    environment:
      MYSQL_DATABASE: ${DATABASE_NAME}
      MYSQL_ROOT_PASSWORD: ${DATABASE_ROOT_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - cloudflare_net
    deploy:
      resources:
        limits:
          memory: 512M

  backend:
    image: ratverg/ebbinghaus-backend:latest
    build: ./backend
    platform: linux/arm64
    container_name: ebbinghaus-backend
    restart: always
    env_file: .env
    depends_on:
      - db
    ports:
      - "8080:8080"
    networks:
      - cloudflare_net
    deploy:
      resources:
        limits:
          memory: 512M

  frontend:
    image: ratverg/ebbinghaus-frontend:latest
    build: ./frontend
    platform: linux/arm64
    container_name: ebbinghaus-frontend
    restart: always
    env_file: .env
    ports:
      - "80:80"
    networks:
      - cloudflare_net
    deploy:
      resources:
        limits:
          memory: 256M

  bot:
    image: ratverg/ebbinghaus-bot:latest
    build: ./telegram_bot
    platform: linux/arm64
    container_name: ebbinghaus-bot
    restart: always
    env_file: .env
    depends_on:
      - backend
    networks:
      - cloudflare_net
    deploy:
      resources:
        limits:
          memory: 256M

networks:
  cloudflare_net:
    external: true

volumes:
  mysql_data: